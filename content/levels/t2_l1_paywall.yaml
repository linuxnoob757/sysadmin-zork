id: t2_l1_paywall
tier: 2
order: 1
title: "The Door With No Handle"
requires_real_vm: true
prerequisites: [t1_l5_users_groups]

intro: |
  Tier 2. You know the building now. Tonight you learn who's allowed to
  TOUCH what — the bureaucracy of users, groups, and the rwx locks on
  every door.

  First thing: the nightly backups aren't running. The script exists at
  /usr/local/bin/nightly-backup.sh, code is fine, cron entry fine, but
  when anything tries to RUN it: Permission denied. A script has to be
  marked executable, or the system treats it like a note nobody's allowed
  to act on — a door with no handle.

  Give the door a handle. Make the script executable for its owner.

victory_text: |
  `-rwxr-xr-x` — that little x, the difference between a script and a
  suggestion. The backup fires on the next tick and actually does its
  job. Permissions aren't decoration. Execution is a permission you add. (+130)

objectives:
  - "Inspect /usr/local/bin/nightly-backup.sh permissions"
  - "Make the script executable (at least for owner)"
  - "Confirm the executable bit is set"

hints:
  - "`ls -l /usr/local/bin/nightly-backup.sh` shows no x in the permission string."
  - "`chmod` changes permissions. `chmod u+x <file>` adds execute for the owner."
  - "Run: `sudo chmod +x /usr/local/bin/nightly-backup.sh`. Verify with `ls -l`."

setup:
  - "printf '#!/bin/bash\\\\necho backup complete\\\\n' > /usr/local/bin/nightly-backup.sh"
  - "chmod 644 /usr/local/bin/nightly-backup.sh"

checks:
  - kind: cmd_succeeds
    command: "test -x /usr/local/bin/nightly-backup.sh"
    describe: "the backup script must be executable"

solution:
  - "chmod +x /usr/local/bin/nightly-backup.sh"

scoring:
  base: 130
  hint_penalty: 30
  par_seconds: 120
