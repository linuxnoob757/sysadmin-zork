id: t2_l1_paywall
tier: 2
order: 1
title: "The Paywall"
requires_real_vm: false
prerequisites: [t1_l5_users_groups]

intro: |
  08:40. Tier 1 signed off. The NOC dashboard lights up green — then the real
  bill lands. $47k for six months of "Active Platform Monitoring." The paywall
  isn't a feature gate; it's a contract. Every alert route, every dashboard,
  every saved search now belongs to the vendor's YAML, locked behind a
  /etc/vendor/ dir you never asked for.

  Your first real shift: the vendor dropped their agent config in /etc/vendor/
  and a healthcheck script at /usr/local/bin/healthcheck.sh. It reports the
  app as `down` — deliberately, so the ticket queue stays full. Flip the
  healthcheck back to up, and drop a marker that says who bypassed the paywall.

victory_text: |
  The healthcheck reads `up`, and /etc/vendor/.bypass confirms you were here.
  The NOC calls it "Unauthorized Remediation." You call it fixing a lie.

objectives:
  - "Inspect the vendor healthcheck script"
  - "Flip the reported state to up"
  - "Log a bypass marker in /etc/vendor/"

hints:
  - "`cat /usr/local/bin/healthcheck.sh` shows where `down` is hardcoded."
  - "sed -i changes it in place."
  - "Write /etc/vendor/.bypass with who touched it."

setup:
  - "mkdir -p /etc/vendor /usr/local/bin /home/student"
  - "printf '#!/bin/bash\\necho down\\n' > /usr/local/bin/healthcheck.sh"
  - "chmod +x /usr/local/bin/healthcheck.sh"
  - "printf 'vendor: paywall active\\n' > /etc/vendor/config.yaml"
  - "rm -f /etc/vendor/.bypass"

checks:
  - kind: file_contains
    path: /usr/local/bin/healthcheck.sh
    expect: "up"
    describe: "the healthcheck must report up"
  - kind: file_exists
    path: /etc/vendor/.bypass
    describe: "a bypass marker must exist in /etc/vendor/"
  - kind: cmd_stdout_contains
    command: "/usr/local/bin/healthcheck.sh"
    expect: "up"
    describe: "running the healthcheck must output up"

solution:
  - "sed -i s/down/up/ /usr/local/bin/healthcheck.sh"
  - "printf 'bypass: t2_l1_paywall student\\n' > /etc/vendor/.bypass"

scoring:
  base: 200
  hint_penalty: 30
  par_seconds: 300
