id: t5_l2_alertmanager_routing
tier: 5
order: 2
title: "The Locksmith's Ghost"
requires_real_vm: true
prerequisites: [t5_l1_prometheus_monitoring]

intro: |
  You named the ghost: 198.51.100.66. Now find what he left behind —
  identity. A backdoor account with UID 0 is root-equivalent; an
  unauthorized wheel member can sudo to root. There should be exactly
  one UID-0 account (root). Audit the accounts, strip the rogue
  identity, and confirm the count is back to one.

victory_text: |
  One UID 0 again. The rogue account is gone. The key the Ferryman cut
  for himself is snapped. (+180)

objectives:
  - "Audit /etc/passwd for UID-0 accounts"
  - "Find and remove the backdoor account"
  - "Confirm only root has UID 0"

hints:
  - "`awk -F: '($3==0){print $1}' /etc/passwd` lists all UID-0 accounts."
  - "`sudo userdel -r <username>'` removes the account and its files."
  - "Confirm with the awk one-liner — only 'root' should remain."

setup:
  - "useradd -u 0 -o -M backdoor 2>/dev/null || true"
  - "echo 'backdoor:x:0:0:backdoor:/root:/bin/bash' >> /etc/passwd 2>/dev/null || true"

checks:
  - kind: cmd_stdout_eq
    command: "awk -F: '($3==0){print $1}' /etc/passwd | sort | uniq"
    expect: "root"
    describe: "only root should have UID 0"

solution:
  - "sudo userdel -r backdoor 2>/dev/null; true"
  - "sed -i '/backdoor/d' /etc/passwd 2>/dev/null; true"

scoring:
  base: 180
  hint_penalty: 30
  par_seconds: 120
