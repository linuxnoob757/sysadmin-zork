id: t1_l4_find_grep_awk
tier: 1
order: 4
title: "The Symlink Maze"
requires_real_vm: false
prerequisites: [t1_l3_pipes_redirects]

intro: |
  04:30 AM. The deploy pipeline's dead in the water, choking on:

      No such file or directory: /srv/app/current

  /srv/app/current is right there in `ls`, glowing red if your terminal
  colors it — a symlink pointing at a release that no longer exists. The
  last release was deleted from under the arrow, leaving the signpost
  pointing proudly into an open grave.

  The real releases live in /srv/app/releases. Find the valid one and
  repoint 'current' at it so the pipeline finds its way home.

victory_text: |
  The signpost points at solid ground again. 'current' resolves, the
  pipeline rolls forward, and the grave was never there at all.

  A symlink's a beautiful thing right up until it isn't: a note that says
  "look over there," pointing with cheerful confidence — even when "over
  there" is a hole. You learned to check where the arrows actually land. (+150)

objectives:
  - "Identify the valid release directory under /srv/app/releases"
  - "Repoint /srv/app/current to that release"
  - "Confirm current resolves to a real directory"

hints:
  - "`ls -l /srv/app` shows where current -> points. A dangling symlink points at something gone."
  - "List the real releases: `ls /srv/app/releases`. The valid one is a real directory; the others are stale."
  - "Force-repoint: `ln -sfn /srv/app/releases/<valid> /srv/app/current`. Verify with `readlink current`."

setup:
  - "mkdir -p /srv/app/releases/release-stable /srv/app/releases/release-old"
  - "touch /srv/app/releases/release-stable/live"
  - "ln -sfn /srv/app/releases/release-old /srv/app/current"
  - "rm -rf /srv/app/releases/release-old"

checks:
  - kind: file_exists
    path: /srv/app/current/live
    describe: "current must resolve to release-stable (the 'live' marker is reachable via current)"
  - kind: cmd_fails
    command: "test -d /srv/app/releases/release-old"
    describe: "the stale release-old must be gone (current can't point at a corpse)"

solution:
  - "rm -rf /srv/app/current"
  - "ln -sfn /srv/app/releases/release-stable /srv/app/current"

scoring:
  base: 150
  hint_penalty: 30
  par_seconds: 120
