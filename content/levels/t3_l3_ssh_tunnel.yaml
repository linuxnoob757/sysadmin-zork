id: t3_l3_ssh_tunnel
tier: 3
order: 3
title: "The Process Eating the Box"
requires_real_vm: true
prerequisites: [t3_l2_firewall]

intro: |
  The whole box has gone slow. Fans screaming. Something is pinning a
  CPU core to 100% — a runaway GREERSON kicked off and never killed.

  Find the high-CPU process in `top` or `ps`. Note its PID. End it —
  cleanly (kill, SIGTERM) if it listens, forcefully (kill -9, SIGKILL)
  only if it refuses. Leave the other processes alone.

victory_text: |
  Gone. The fans wind down, the prompt snaps back, load average slides
  back down. You found it, learned its PID, and ended it with exactly
  as much force as it required. Force is a tool, not a personality. (+150)

objectives:
  - "Identify the runaway high-CPU process"
  - "Terminate it by its PID (kill first, kill -9 only if needed)"
  - "Confirm the process is gone"

hints:
  - "Find it: `top -b -n1 | head -20` or `ps aux --sort=-%cpu | head`. Note the PID."
  - "Polite stop: `kill <PID>`. If it refuses: `kill -9 <PID>`."
  - "Confirm it's gone: `ps -p <PID>` should return nothing."

setup:
  - "nohup bash -c 'while true; do : ; done' >/dev/null 2>&1 &"

checks:
  - kind: cmd_fails
    command: "ps aux --sort=-%cpu | grep '[w]hile true' | head -1"
    describe: "the runaway CPU-hogging process must be gone"

solution:
  - "PID=$(ps aux | grep '[w]hile true' | awk '{print $2}' | head -1); kill $PID; sleep 1; kill -9 $PID 2>/dev/null; true"

scoring:
  base: 150
  hint_penalty: 30
  par_seconds: 120
