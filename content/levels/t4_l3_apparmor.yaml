id: t4_l3_apparmor
tier: 4
order: 3
title: "The Wrong Door Faces the Street"
requires_real_vm: true
prerequisites: [t4_l2_selinux]

intro: |
  The backdoor you just pulled might have a partner: a service bound to
  0.0.0.0, listening on every interface including the one that faces the
  world, when it should only answer to 127.0.0.1. The firewall was the
  only thing hiding it. Bind it to loopback so it can't be reached from
  outside — ever, firewall or no firewall.

victory_text: |
  ss shows it on 127.0.0.1:port, not 0.0.0.0. Even if the firewall falls,
  the door doesn't open outward anymore. Layers. Always layers. (+150)

objectives:
  - "Find the service binding to 0.0.0.0 on a high port"
  - "Kill that process and relaunch it bound to 127.0.0.1 only"
  - "Confirm with ss that it no longer listens on 0.0.0.0"

hints:
  - "`sudo ss -tlnp` shows listeners. Anything bound to 0.0.0.0 faces the street."
  - "Kill the offender by PID, then relaunch on 127.0.0.1."
  - "Verify: the offender should now show 127.0.0.1, not 0.0.0.0."

setup:
  - "python3 -c 'import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind((\"0.0.0.0\",6666)); s.listen(5); time.sleep(99999)' &"
  - "sleep 1"

checks:
  - kind: cmd_fails
    command: "ss -tln 2>/dev/null | grep '0.0.0.0:6666'"
    describe: "nothing may listen on 0.0.0.0:6666 anymore"
  - kind: cmd_stdout_contains
    command: "ss -tln 2>/dev/null | grep '127.0.0.1:6666'"
    expect: "127.0.0.1:6666"
    describe: "the service must bind to 127.0.0.1:6666 (loopback only)"

solution:
  - "PID=$(ss -tlnp 2>/dev/null | grep '0.0.0.0:6666' | head -1); kill $(echo \"$PID\" | grep -oP 'pid=\\K[0-9]+' | head -1) 2>/dev/null; true"
  - "python3 -c 'import socket,time; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind((\"127.0.0.1\",6666)); s.listen(5); time.sleep(99999)' &"
  - "sleep 1"

scoring:
  base: 150
  hint_penalty: 30
  par_seconds: 150
