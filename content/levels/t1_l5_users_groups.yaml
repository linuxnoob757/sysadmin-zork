id: t1_l5_users_groups
tier: 1
order: 5
title: "Redirect the Flow"
requires_real_vm: false
prerequisites: [t1_l4_find_grep_awk]

intro: |
  05:30 AM. Last fire of the night, and of course it's paperwork.

  Overnight the batch job vomited 40,000 lines into /var/log/batch/run.log.
  Buried in the noise are the lines stamped ERROR. The morning report
  needs them pulled clean — just the errors, each unique one counted,
  sorted so the worst repeat offender sits at the top.

  You won't read 40,000 lines. You'll build a machine out of pipes and
  redirection that reads them for you: filter the noise, tally what's
  left, pour the result into /var/reports/errors.txt.

victory_text: |
  Forty thousand lines of noise, boiled down to a report a tired human can
  read. /var/reports/errors.txt — clean, counted, sorted, worst-first.

  You plumbed it: grep to filter, sort and uniq to tally, a single '>' to
  pour it where it belongs. A good admin is mostly a plumber who bills
  better. (+150)

objectives:
  - "Extract ERROR lines from /var/log/batch/run.log"
  - "Produce a unique, count-sorted list in /var/reports/errors.txt"

hints:
  - "Chain of tools joined by pipes: `grep ERROR /var/log/batch/run.log`."
  - "The classic tally: `grep ERROR ... | sort | uniq -c | sort -nr`. uniq -c counts, sort -nr puts biggest first."
  - "Full line: `grep ERROR /var/log/batch/run.log | sort | uniq -c | sort -nr > /var/reports/errors.txt`. Make the dir first: `mkdir -p /var/reports`. Then `check`."

setup:
  - "mkdir -p /var/log/batch /var/reports"
  - "printf 'INFO boot complete\\\\nERROR disk full on /dev/sda1\\\\nERROR disk full on /dev/sda1\\\\nINFO rotation ok\\\\nERROR cpu temp 90C\\\\nERROR network unreachable\\\\nERROR disk full on /dev/sda1\\\\nINFO cleanup done\\\\n' > /var/log/batch/run.log"
  - "rm -f /var/reports/errors.txt"

checks:
  - kind: file_exists
    path: /var/reports/errors.txt
    describe: "the report file must exist"
  - kind: cmd_stdout_contains
    command: "head -1 /var/reports/errors.txt"
    expect: "ERROR disk full"
    describe: "the report must be sorted worst-first (top error is the repeated one)"
  - kind: cmd_stdout_eq
    command: "wc -l < /var/reports/errors.txt"
    expect: "3"
    describe: "exactly 3 unique error types"

solution:
  - "mkdir -p /var/reports"
  - "grep ERROR /var/log/batch/run.log | sort | uniq -c | sort -nr > /var/reports/errors.txt"

scoring:
  base: 150
  hint_penalty: 30
  par_seconds: 150
