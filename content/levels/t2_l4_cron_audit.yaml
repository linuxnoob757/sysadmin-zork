id: t2_l4_cron_audit
tier: 2
order: 4
title: "The Members-Only Club"
requires_real_vm: true
prerequisites: [t2_l3_tar_extraction]

intro: |
  06:33. New hire 'jordan' can't do their job — every shared file is
  Permission denied. The files under /srv/finance are fine. Their
  permissions are exactly right — group-readable by 'finance'. The problem:
  jordan isn't in the finance group. Standing outside a members-only
  club with a valid reason to be inside and no stamp on their hand.

  Get jordan into the finance group. Don't evict them from their existing
  groups — append, never replace.

victory_text: |
  `jordan : jordan finance ...` — stamped, holding every other group.
  The file opens. Access, when it works, is invisible.

  The trap you dodged: `usermod -aG`. The -a means append. Without it,
  usermod -G REPLACES every group, kicking them out of everything.
  You read the whole command before you ran it. (+150)

objectives:
  - "Verify jordan is missing from the finance group"
  - "Add jordan to the finance group (append, not replace)"
  - "Confirm jordan is now a member of finance"

hints:
  - "`groups jordan` shows current memberships. finance isn't listed."
  - "`usermod -aG finance jordan` adds the group without removing others."
  - "Verify with `groups jordan` — finance should appear. Then `check`."

setup:
  - "mkdir -p /srv/finance"
  - "printf 'Q3 revenue numbers\\\\n' > /srv/finance/q3-report.csv"
  - "chgrp finance /srv/finance /srv/finance/q3-report.csv"
  - "chmod 640 /srv/finance/q3-report.csv"
  - "groupadd -f finance"
  - "useradd -m -G jordan jordan 2>/dev/null || usermod -aG jordan jordan"

checks:
  - kind: cmd_stdout_contains
    command: "id jordan"
    expect: "finance"
    describe: "jordan must be a member of the finance group"

solution:
  - "usermod -aG finance jordan"

scoring:
  base: 150
  hint_penalty: 30
  par_seconds: 120
