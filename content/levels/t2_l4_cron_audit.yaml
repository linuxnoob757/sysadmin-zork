id: t2_l4_cron_audit
tier: 2
order: 4
title: "Cron Audit"
requires_real_vm: true
prerequisites: [t1_l4_find_grep_awk]

intro: |
  11:55. The paywall's cron runs every minute as root — /etc/cron.d/vendor-
  pulse. It curls the NOC with a heartbeat that masks real outages. The
  playbook says "audit the cron." Your job: read the cron entry, kill the
  heartbeat URL (point it at /dev/null), and log the kill in /var/log/cron-
  audit.log so next week's auditor sees you did it.

  cron is the NOC's pulse. Cut it.

victory_text: |
  The vendor cron entry is neutered — its heartbeat now writes to /dev/null —
  and the audit log notes the kill. The NOC pages. Nobody answers.

objectives:
  - "Inspect the vendor cron entry in /etc/cron.d/"
  - "Redirect the heartbeat command output to /dev/null"
  - "Append an audit entry to /var/log/cron-audit.log"

hints:
  - "`cat /etc/cron.d/vendor-pulse` shows the running command."
  - "sed -i replaces the curl target."
  - "`echo 'audit...' >> /var/log/cron-audit.log` logs the change."

setup:
  - "mkdir -p /etc/cron.d /var/log"
  - "printf '* * * * * root curl -s http://noc.vendor.example/heartbeat >> /var/log/vendor.log 2>&1\\n' > /etc/cron.d/vendor-pulse"
  - "rm -f /var/log/cron-audit.log"

checks:
  - kind: file_contains
    path: /etc/cron.d/vendor-pulse
    expect: "/dev/null"
    describe: "the heartbeat output must be redirected to /dev/null"
  - kind: file_contains
    path: /var/log/cron-audit.log
    expect: "neutered"
    describe: "the audit log must record the cron kill"
  - kind: file_absent
    path: /var/log/vendor.log
    describe: "the live heartbeat log must stop growing"

solution:
  - "sed -i 's|/var/log/vendor.log|/dev/null|g' /etc/cron.d/vendor-pulse"
  - "printf 'cron-audit: vendor-pulse neutered by student at shift t2_l4\\n' >> /var/log/cron-audit.log"

scoring:
  base: 300
  hint_penalty: 30
  par_seconds: 300
