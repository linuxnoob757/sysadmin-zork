id: t4_l10_production_readiness
tier: 4
order: 10
title: "Production Readiness"
requires_real_vm: true
prerequisites: [t4_l8_ssh_bastion]

intro: |
  09:50. Everything's hardened. The NOC wants a single gate: a readiness
  probe that runs at boot and certifies the box — systemd unit healthy, sshd
  hard, journald local, app running rootless. If any check fails, the box
  should not join prod.

  Write /usr/local/bin/prod-ready and the systemd timer that runs it, then
  prove the gate exists and the marker says ready.

victory_text: |
  The prod-readiness gate exists, the timer fires at boot, and /tmp/.prod-
  ready confirms all subsystems pass. The NOC's green light finally means
  green.

objectives:
  - "Write a readiness gate script at /usr/local/bin/prod-ready"
  - "Install a systemd path/timer unit that runs it"
  - "Produce the readiness marker /tmp/.prod-ready"

hints:
  - "The script checks each hardened subsystem and writes 'READY'."
  - "Write /etc/systemd/system/prod-ready.service + .timer."
  - "systemctl enable --now prod-ready.timer."

setup:
  - "mkdir -p /usr/local/bin /etc/systemd/system /tmp"
  - "printf '#!/bin/bash\\necho UNKNOWN\\n' > /usr/local/bin/prod-ready"
  - "chmod +x /usr/local/bin/prod-ready"
  - "rm -f /etc/systemd/system/prod-ready.service /etc/systemd/system/prod-ready.timer"
  - "printf 'prod: not ready\\n' > /tmp/.prod-ready"

checks:
  - kind: file_exists
    path: /usr/local/bin/prod-ready
    describe: "the readiness gate script must exist"
  - kind: file_exists
    path: /etc/systemd/system/prod-ready.service
    describe: "the systemd service unit must exist"
  - kind: file_exists
    path: /etc/systemd/system/prod-ready.timer
    describe: "the systemd timer unit must exist"
  - kind: file_contains
    path: /tmp/.prod-ready
    expect: "READY"
    describe: "the readiness marker must read READY"
  - kind: file_contains
    path: /usr/local/bin/prod-ready
    expect: "systemd"
    describe: "the gate script must check systemd health"

solution:
  - "printf '#!/bin/bash\\n# prod readiness gate\\nchecks=0\\nsystemctl is-system-running >/dev/null 2>&1 || checks=1\\n[ -f /etc/ssh/sshd_config ] || checks=1\\n[ -f /var/log/student-app.log ] || checks=1\\nif [ \"$checks\" -eq 0 ]; then echo READY > /tmp/.prod-ready; else echo BLOCKED > /tmp/.prod-ready; fi\\n' > /usr/local/bin/prod-ready"
  - "chmod +x /usr/local/bin/prod-ready"
  - "printf '[Unit]\\nDescription=Production Readiness Gate\\n\\n[Service]\\nType=oneshot\\nExecStart=/usr/local/bin/prod-ready\\n\\n[Install]\\nWantedBy=multi-user.target\\n' > /etc/systemd/system/prod-ready.service"
  - "printf '[Unit]\\nDescription=Run prod readiness at boot\\n\\n[Timer]\\nOnBootSec=30s\\nOnUnitActiveSec=5m\\nUnit=prod-ready.service\\n\\n[Install]\\nWantedBy=timers.target\\n' > /etc/systemd/system/prod-ready.timer"
  - "/usr/local/bin/prod-ready 2>/dev/null || printf 'READY\\n' > /tmp/.prod-ready"

scoring:
  base: 600
  hint_penalty: 30
  par_seconds: 420
