id: t1_l1_directory_layout
tier: 1
order: 1
title: "Directory Layout"
requires_real_vm: false
prerequisites: [t0_l1_first_shift]

intro: |
  01:15. The pager's a lie. The app's "down" marker was never an app — it was a
  placeholder. Your real brief lands in /srv/inventory. A config dump, three
  hosts tagged web-01, db-01, cache-01, and a directory tree that someone
  half-deleted. The NOC playbook says "trust the hierarchy." You say: show me
  the tree.

  Task: rebuild the inventory structure under /srv/inventory from the debris.
  Each host needs a config dir, a logs dir, and a `.managed` marker confirming
  you touched it. Then prove the layout with `find`.

victory_text: |
  /srv/inventory/{web-01,db-01,cache-01} each hold conf/ logs/ and .managed.
  The NOC can stop paging you. It'll bill you for "Configuration Baselining"
  next.

objectives:
  - "Create config + logs dirs for each host under /srv/inventory"
  - "Mark each host as managed with a .managed flag file"
  - "Verify the full tree with find"

hints:
  - "`ls /srv/inventory` — see what's left of the half-deleted structure."
  - "`mkdir -p /srv/inventory/HOST/conf /srv/inventory/HOST/logs` per host."
  - "`find /srv/inventory -type f` confirms every .managed marker is present."

setup:
  - "mkdir -p /srv/inventory"
  - "echo 'corrupted' > /srv/inventory/.broken-state"
  - "mkdir -p /srv/inventory/web-01"
  - "rm -f /srv/inventory/web-01/.managed"
  - "rm -f /srv/inventory/db-01/.managed"
  - "rm -f /srv/inventory/cache-01/.managed"
  - "rm -rf /srv/inventory/web-01/conf /srv/inventory/web-01/logs"
  - "rm -rf /srv/inventory/db-01/conf /srv/inventory/db-01/logs"
  - "rm -rf /srv/inventory/cache-01/conf /srv/inventory/cache-01/logs"

checks:
  - kind: file_exists
    path: /srv/inventory/web-01/conf
    describe: "web-01 must have a conf dir"
  - kind: file_exists
    path: /srv/inventory/web-01/logs
    describe: "web-01 must have a logs dir"
  - kind: file_exists
    path: /srv/inventory/web-01/.managed
    describe: "web-01 must be marked managed"
  - kind: file_exists
    path: /srv/inventory/db-01/conf
    describe: "db-01 must have a conf dir"
  - kind: file_exists
    path: /srv/inventory/db-01/logs
    describe: "db-01 must have a logs dir"
  - kind: file_exists
    path: /srv/inventory/db-01/.managed
    describe: "db-01 must be marked managed"
  - kind: file_exists
    path: /srv/inventory/cache-01/conf
    describe: "cache-01 must have a conf dir"
  - kind: file_exists
    path: /srv/inventory/cache-01/logs
    describe: "cache-01 must have a logs dir"
  - kind: file_exists
    path: /srv/inventory/cache-01/.managed
    describe: "cache-01 must be marked managed"
  - kind: cmd_stdout_contains
    command: "find /srv/inventory -name .managed | wc -l"
    expect: "3"
    describe: "find must report exactly 3 managed hosts"

solution:
  - "mkdir -p /srv/inventory/web-01/conf /srv/inventory/web-01/logs /srv/inventory/db-01/conf /srv/inventory/db-01/logs /srv/inventory/cache-01/conf /srv/inventory/cache-01/logs"
  - "touch /srv/inventory/web-01/.managed /srv/inventory/db-01/.managed /srv/inventory/cache-01/.managed"
  - "rm -f /srv/inventory/.broken-state"

scoring:
  base: 200
  hint_penalty: 30
  par_seconds: 180
