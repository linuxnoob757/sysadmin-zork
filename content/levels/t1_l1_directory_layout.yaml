id: t1_l1_directory_layout
tier: 1
order: 1
title: "Lost in the Filesystem"
requires_real_vm: false
prerequisites: [t0_l1_first_shift]

intro: |
  01:15. The pager coughs up a single line, all caps, no context:

      CANT FIND THE VAULT

  No path. No breadcrumb. Classic GREERSON — he carried the whole layout
  of this filesystem in his head like a man hoarding the only map in a
  maze, and when he walked out he took it with him. Documentation was
  beneath him.

  Here's what you can piece together: somewhere on this box there's a
  directory the deploy team calls the vault — /srv/company/vault. They
  swear it's there. Get yourself to it. Stand inside it. Then prove you
  found it in the dark — drop a file named 'found' in the vault.

  Four words keep you breathing on nights like this: pwd, ls, cd, find.

victory_text: |
  /srv/company/vault/found — signed, dated, witnessed by the hum of the
  racks. You found your footing in a filesystem you'd never seen, with no
  map and no help, using nothing but pwd and ls and your own two feet.

  The thing about getting lost: you learn to check where you're standing
  before you throw a single punch. (+130)

objectives:
  - "Navigate to /srv/company/vault"
  - "Create a file named 'found' inside the vault"

hints:
  - "Lost is just not knowing where you are. `pwd` prints your current directory; `ls` shows what's around. `cd /srv/company/vault` walks there in one step."
  - "If you're not sure the path is right, `ls -ld /srv/company/vault` confirms it's a real directory before you commit to cd."
  - "Stand inside the vault: `cd /srv/company/vault`, then `touch found`, then `check`."

setup:
  - "mkdir -p /srv/company/vault"
  - "rm -f /srv/company/vault/found"

checks:
  - kind: file_exists
    path: /srv/company/vault/found
    describe: "a file named 'found' must exist inside the vault directory"
  - kind: cmd_succeeds
    command: "test -f /srv/company/vault/found"
    describe: "the 'found' file must exist inside the vault directory"

solution:
  - "touch /srv/company/vault/found"

scoring:
  base: 130
  hint_penalty: 30
  par_seconds: 120
