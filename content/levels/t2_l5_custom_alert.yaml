id: t2_l5_custom_alert
tier: 2
order: 5
title: "The Shared Table"
requires_real_vm: true
prerequisites: [t2_l4_cron_audit]

intro: |
  08:55. /srv/shared is meant to be a common table where the 'staff'
  group drops files. But every file someone creates lands owned by their
  PRIVATE group, so nobody else can edit it. And anyone can wipe anyone's
  work on the way out. A shared table where you can't touch what others
  put down but you CAN sweep the whole thing away.

  Two special bits fix this:
  - SETGID (chmod g+s) makes new files inherit the directory's group.
  - STICKY (chmod +t) says "you can only delete files you own."

  Set the directory's group to 'staff', then apply setgid and sticky.

victory_text: |
  `drwxrwsr-t`. Setgid, sticky, staff group. The table works now —
  everyone can collaborate, nobody can wipe the table but their own plate.

  Layers of control on a single directory. GREERSON announced the
  concept and never wired it up. You built it in four commands and
  genuine understanding of what s and t do. (+200)

objectives:
  - "Set the group of /srv/shared to 'staff'"
  - "Apply the setgid bit (chmod g+s)"
  - "Apply the sticky bit (chmod +t)"
  - "Confirm with ls -ld that both bits are set"

hints:
  - "First: `chgrp staff /srv/shared`. Then set both bits: `chmod g+s /srv/shared` and `chmod +t /srv/shared`."
  - "Or all at once: `chmod g+s,+t /srv/shared` (or `chmod 3775` if staff has rwx)."
  - "Verify with `ls -ld /srv/shared` — look for `s` (setgid) and `t` (sticky) in the permission string."

setup:
  - "mkdir -p /srv/shared"
  - "chgrp root /srv/shared"
  - "chmod 777 /srv/shared"
  - "groupadd -f staff"

checks:
  - kind: cmd_succeeds
    command: "test -g /srv/shared && test -k /srv/shared"
    describe: "the directory must have setgid and sticky bits set"
  - kind: cmd_stdout_contains
    command: "stat -c '%A' /srv/shared"
    expect: "t"
    describe: "sticky bit (t) must be visible in the permission string"

solution:
  - "chgrp staff /srv/shared"
  - "chmod g+s /srv/shared"
  - "chmod +t /srv/shared"

scoring:
  base: 200
  hint_penalty: 30
  par_seconds: 180
