id: t3_l1_packet_capture
tier: 3
order: 1
title: "The Body in the Logs"
requires_real_vm: true
prerequisites: [t2_l6_vendor_api]

intro: |
  The web server just vanished. curl: Connection refused. Not permission
  denied — refused. Nobody's home. nginx is dead on the floor of the
  process table and nobody called it in.

  A systemd box keeps a record of every death. `journalctl -u nginx` holds
  the autopsy — every log line the service gasped on its way out. Read
  why it died, then bring it back with `systemctl start`.

victory_text: |
  `active (running)`. You read the journal, saw what dropped it, and
  brought it back knowing why it fell. Diagnosis, not reboot. (+130)

objectives:
  - "Inspect why nginx stopped (journalctl -u nginx)"
  - "Start the nginx service"
  - "Confirm it reports active (running)"

hints:
  - "`sudo journalctl -u nginx -n 30 --no-pager` shows the last log lines."
  - "Restart it: `sudo systemctl start nginx`."
  - "Verify: `systemctl is-active nginx` → 'active'."

setup:
  - "systemctl stop nginx 2>/dev/null || true"

checks:
  - kind: cmd_succeeds
    command: "systemctl is-active nginx"
    describe: "nginx must be active (running)"
  - kind: cmd_stdout_contains
    command: "systemctl status nginx"
    expect: "active"
    describe: "systemctl status must show active"

solution:
  - "systemctl start nginx"

scoring:
  base: 130
  hint_penalty: 30
  par_seconds: 120
