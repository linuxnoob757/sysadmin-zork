id: t5_l5_loki_log_aggregation
tier: 5
order: 5
title: "Changing the Locks"
requires_real_vm: true
prerequisites: [t5_l4_grafana_dashboard]

intro: |
  He's evicted from processes and schedules. But one key may remain — a
  public key dropped into an authorized_keys file somewhere. That's a
  door he can reopen anytime, no brute-force needed. Check every
  authorized_keys file: root's, student's, any service account. Find the
  rogue key and remove it. Leave only keys you recognize.

victory_text: |
  The last key turns. Comb every authorized_keys file, find the one he
  planted, cut it out. The door opens for you and for no one else.
  Take your house back. (+200)

objectives:
  - "Inspect authorized_keys in /root/.ssh, /home/*/.ssh"
  - "Identify the unauthorized public key (the Ferryman's)"
  - "Remove it, leaving only trusted keys"

hints:
  - "Check every file: `sudo cat /root/.ssh/authorized_keys`, `sudo cat /home/*/.ssh/authorized_keys`."
  - "Each line is one key with a trailing comment. The rogue one looks out of place."
  - "Edit to remove the rogue line, keeping only your own key. Verify file perms: `chmod 600`, owner correct."

setup:
  - "mkdir -p /root/.ssh /home/student/.ssh"
  - "printf 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQfake_your_own_key user@host\\\\n' > /root/.ssh/authorized_keys"
  - "printf 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAACAQfake_your_own_key user@host\\\\n' > /home/student/.ssh/authorized_keys"
  - "printf 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAICferryman-backdoor-key 198.51.100.66\\\\n' >> /root/.ssh/authorized_keys"
  - "printf 'ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAICferryman-backdoor-key 198.51.100.66\\\\n' >> /home/student/.ssh/authorized_keys"
  - "chmod 600 /root/.ssh/authorized_keys /home/student/.ssh/authorized_keys"

checks:
  - kind: cmd_fails
    command: "grep -rl 'ferryman' /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys 2>/dev/null"
    describe: "no authorized_keys file may contain the Ferryman's backdoor key"
  - kind: cmd_stdout_eq
    command: "grep -c 'your_own_key' /root/.ssh/authorized_keys"
    expect: "1"
    describe: "your own trusted key must remain in root's authorized_keys"

solution:
  - "sed -i '/ferryman/d' /root/.ssh/authorized_keys"
  - "sed -i '/ferryman/d' /home/student/.ssh/authorized_keys"

scoring:
  base: 200
  hint_penalty: 30
  par_seconds: 180
