id: t4_l2_selinux
tier: 4
order: 2
title: "The Open Window"
requires_real_vm: true
prerequisites: [t4_l1_systemd_hardening]

intro: |
  You found the backdoor — a listener on port 6667. But the firewall was
  also waving traffic through to it. The wall has a hole in the shape of
  your problem. Remove that hole permanently, then reload the firewall so
  the window is shut for good, not just until reboot.

victory_text: |
  The hole's bricked over, written to disk, permanent. Port 6667 no
  longer passes through the wall. Defense in depth — the firewall AND
  no listener. (+140)

objectives:
  - "Inspect the firewall's allowed ports (firewall-cmd --list-all)"
  - "Permanently remove the rule exposing port 6667"
  - "Reload firewalld and confirm the port is no longer allowed"

hints:
  - "See what's allowed: `sudo firewall-cmd --list-all`. Look under `ports:`."
  - "Remove it: `sudo firewall-cmd --permanent --remove-port=6667/tcp`."
  - "Make it live: `sudo firewall-cmd --reload`. Confirm with `--list-all`."

setup:
  - "firewall-cmd --permanent --add-port=6667/tcp 2>/dev/null || true"
  - "firewall-cmd --reload 2>/dev/null || true"

checks:
  - kind: cmd_fails
    command: "firewall-cmd --permanent --list-ports 2>/dev/null | grep 6667"
    describe: "port 6667 must no longer be in the permanent port list"

solution:
  - "sudo firewall-cmd --permanent --remove-port=6667/tcp"
  - "sudo firewall-cmd --reload"

scoring:
  base: 140
  hint_penalty: 30
  par_seconds: 150
