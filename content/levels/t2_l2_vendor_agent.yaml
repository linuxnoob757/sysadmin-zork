id: t2_l2_vendor_agent
tier: 2
order: 2
title: "Whose Box Is It Anyway"
requires_real_vm: true
prerequisites: [t2_l1_paywall]

intro: |
  02:45. The website's "up" but frozen — serving pages it can't update.
  The logs: Permission denied, over and over. Traced to /srv/www —
  the web service runs as www-data, but every file under there is owned
  by root. Somebody ran a restore as root "just to get it working" and
  never handed the house back to the tenant.

  Ownership is two things on Linux: a user and a group. Right now both
  are wrong. Hand /srv/www back to www-data, top to bottom.

victory_text: |
  `www-data www-data`, straight down the tree. The service reaches for
  its files and, for the first time in weeks, the files reach back.

  Ownership is the deed, not the lock. A service can have every
  permission in the world and still be helpless if the files wear someone
  else's name. (+140)

objectives:
  - "Set recursive ownership of /srv/www to www-data:www-data"
  - "Confirm files no longer belong to root"

hints:
  - "`ls -lR /srv/www` shows everything owned by root root."
  - "`chown -R user:group /path` changes ownership recursively. For the web service: www-data:www-data."
  - "Run: `sudo chown -R www-data:www-data /srv/www`. Verify with `ls -l /srv/www`."

setup:
  - "mkdir -p /srv/www"
  - "printf '<html>index</html>' > /srv/www/index.html"
  - "chown root:root /srv/www /srv/www/index.html"

checks:
  - kind: cmd_stdout_contains
    command: "stat -c '%U:%G' /srv/www"
    expect: "www-data:www-data"
    describe: "the /srv/www directory must be owned by www-data:www-data"
  - kind: cmd_stdout_contains
    command: "stat -c '%U:%G' /srv/www/index.html"
    expect: "www-data:www-data"
    describe: "files under /srv/www must be owned by www-data:www-data"

solution:
  - "chown -R www-data:www-data /srv/www"

scoring:
  base: 140
  hint_penalty: 30
  par_seconds: 150
