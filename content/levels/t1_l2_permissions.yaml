id: t1_l2_permissions
tier: 1
order: 2
title: "The Hidden File"
requires_real_vm: false
prerequisites: [t1_l1_directory_layout]

intro: |
  10:47 PM. The pager coughs up something almost human — a note from
  GREERSON's old work account, timestamped three minutes before he
  vanished:

      "RECOVERY CODE IS WHERE YOU LOOK BUT DONT SEE"

  Even gone, the man can't resist a riddle. "Where you look but
  don't see" — on a Linux box that's one thing and one thing only: a
  dotfile. A file whose name starts with '.', sitting in plain sight
  in your home directory, politely invisible to any lazy `ls` that
  doesn't know to ask for more.

  Find the hidden dotfile in your home directory. Inside it: a recovery
  code. Read it, then write that code — just the code — into a file
  called 'answer' in your home directory.

victory_text: |
  You saw what was sitting there the whole time. The code checks out,
  copied clean into ~/answer, no smirk required.

  Hidden was never gone. Half this job is just knowing to add the '-a'
  — to make a system show you the things it tucks politely out of sight.
  Configs. Credentials. The quiet truth of how a machine really behaves
  when it thinks nobody's looking. All dotfiles, in their way. (+120)

objectives:
  - "Reveal the hidden dotfile in your home directory (ls -a)"
  - "Read the recovery code inside it"
  - "Write that exact code into ~/answer"

hints:
  - "A plain `ls` won't show it. Files starting with a dot are hidden. Try `ls -a ~`."
  - "Find the dotfile that isn't standard shell config, and `cat` it to read the code."
  - "Read the file with cat, then write the code: `echo 'THECODE' > ~/answer` (swap in the real code), then `check`."

setup:
  - "echo 'RECOVERY_CODE: zork-7th-mistake-42' > /home/student/.recovery-code"
  - "rm -f /home/student/answer"

checks:
  - kind: file_exists
    path: /home/student/answer
    describe: "an 'answer' file must exist in the home directory"
  - kind: file_contains
    path: /home/student/answer
    expect: "zork-7th-mistake-42"
    describe: "answer must contain the recovery code from the dotfile"

solution:
  - "cat /home/student/.recovery-code"
  - "echo 'zork-7th-mistake-42' > /home/student/answer"

scoring:
  base: 120
  hint_penalty: 30
  par_seconds: 90
