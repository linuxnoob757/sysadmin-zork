id: t4_l4_auditd
tier: 4
order: 4
title: "Building the Wall"
requires_real_vm: true
prerequisites: [t4_l3_apparmor]

intro: |
  Patchwork defenses aren't enough. It's time to set a policy: default-deny.
  Flip the firewall's posture so everything is forbidden unless explicitly
  allowed — SSH and the web service only. Build the wall, leave exactly
  two guarded doors.

victory_text: |
  Default-deny is live. Only ssh and http/https pass the gate. Everything
  else — including that backdoor port — falls to silence. (+160)

objectives:
  - "Ensure ssh, http, https are explicitly allowed (permanent)"
  - "Set the default firewalld zone to drop"
  - "Reload and confirm only intended services pass"

hints:
  - "Allow first: `sudo firewall-cmd --permanent --add-service=ssh`, `--add-service=http`, `--add-service=https`."
  - "Flip: `sudo firewall-cmd --set-default-zone=drop`. Reload: `sudo firewall-cmd --reload`."
  - "`--list-all` on the drop zone shows the two doors and nothing else."

setup:
  - "firewall-cmd --get-default-zone 2>/dev/null || true"

checks:
  - kind: cmd_stdout_eq
    command: "firewall-cmd --get-default-zone"
    expect: "drop"
    describe: "default zone must be drop (default-deny)"

solution:
  - "sudo firewall-cmd --permanent --add-service=ssh"
  - "sudo firewall-cmd --permanent --add-service=http"
  - "sudo firewall-cmd --permanent --add-service=https"
  - "sudo firewall-cmd --set-default-zone=drop"
  - "sudo firewall-cmd --reload"

scoring:
  base: 160
  hint_penalty: 30
  par_seconds: 180
