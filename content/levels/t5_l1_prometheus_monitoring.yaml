id: t5_l1_prometheus_monitoring
tier: 5
order: 1
title: "Footprints"
requires_real_vm: true
prerequisites: [t4_l10_production_readiness]

intro: |
  The story starts with a login. Somewhere in /var/log/secure is the
  one successful SSH session that shouldn't have happened — from an
  outside IP you don't recognize, at 3:33 AM. Find it, isolate the
  source address, and write it into /root/incident/attacker_ip.txt.
  Name the ghost before you hunt it.

victory_text: |
  One IP in a text file, and the whole night snaps into focus. That's
  the door he walked through. You separated the roar of ten thousand
  failures from the single quiet success that mattered. (+160)

objectives:
  - "Examine /var/log/secure for the anomalous successful login"
  - "Identify the attacker's source IP"
  - "Record it in /root/incident/attacker_ip.txt"

hints:
  - "`sudo grep 'Accepted' /var/log/secure` shows successful logins."
  - "Look for a login at an odd hour from an unfamiliar IP."
  - "`sudo mkdir -p /root/incident && echo '<IP>' | sudo tee /root/incident/attacker_ip.txt`."

setup:
  - "mkdir -p /root/incident /var/log"
  - "rm -f /root/incident/attacker_ip.txt"
  - "echo 'Aug 15 03:33:01 box sshd[1234]: Accepted publickey for root from 10.0.2.15 port 54321' >> /var/log/secure 2>/dev/null || echo 'Aug 15 03:33:01 box sshd[1234]: Accepted publickey for root from 198.51.100.66 port 54321' >> /var/log/secure"
  - "echo 'Aug 15 03:20:00 box sshd[1100]: Failed password for invalid user admin from 203.0.113.5' >> /var/log/secure"

checks:
  - kind: file_contains
    path: /root/incident/attacker_ip.txt
    expect: "198.51.100.66"
    describe: "the attacker's IP must be recorded"

solution:
  - "mkdir -p /root/incident"
  - "grep 'Accepted' /var/log/secure | grep -oP 'from \\K[0-9.]+' | head -1 | tee /root/incident/attacker_ip.txt"

scoring:
  base: 160
  hint_penalty: 30
  par_seconds: 150
