id: t3_l2_firewall
tier: 3
order: 2
title: "The Thing That Wouldn't Stay Dead"
requires_real_vm: true
prerequisites: [t3_l1_packet_capture]

intro: |
  nginx is up. But you know it'll be down again on reboot — `systemctl
  start` only runs it NOW. `systemctl enable` wires it to boot forever.
  GREERSON started things but never made them permanent.

  Enable nginx so it survives reboot on its own, and confirm it's
  `enabled` (not just `active`).

victory_text: |
  `enabled`. nginx clawss its way up after every reboot, no human
  required. Start versus enable — now versus always. (+140)

objectives:
  - "Enable nginx so it starts automatically at boot"
  - "Confirm it is currently running"
  - "Confirm `systemctl is-enabled nginx` reports enabled"

hints:
  - "`sudo systemctl enable nginx` wires it to boot. `--now` does enable+start together."
  - "Verify: `systemctl is-enabled nginx` and `systemctl is-active nginx`."
  - "Run: `sudo systemctl enable --now nginx`, then confirm both."

setup:
  - "systemctl disable nginx 2>/dev/null || true"

checks:
  - kind: cmd_stdout_eq
    command: "systemctl is-enabled nginx"
    expect: "enabled"
    describe: "nginx must be enabled at boot"
  - kind: cmd_succeeds
    command: "systemctl is-active nginx"
    describe: "nginx must be running"

solution:
  - "systemctl enable --now nginx"

scoring:
  base: 140
  hint_penalty: 30
  par_seconds: 120
