id: t3_l5_reverse_proxy
tier: 3
order: 5
title: "The Job That Runs at Midnight"
requires_real_vm: true
prerequisites: [t3_l4_service_discovery]

intro: |
  That service name from the journal — it's a timer. `sys-maintenance.timer`,
  running nightly at 3:33 AM, reaching across the river to an address GREERSON
  left behind. It's enabled, persistent — the one thing GREERSON actually
  finished. Now it's pointing at someone who shouldn't have it.

  Stop it, disable it, and MASK it so it can never fire again. Masking is the
  deadbolt — it makes the unit impossible to start at all until a human
  deliberately unmasks it.

victory_text: |
  `masked`. The deadbolt slides home. Whatever was reaching across the river
  every midnight will not do it again — not tonight, not at reboot, not until
  a human with the full story unmasks it. (+180)

objectives:
  - "Stop the sys-maintenance.timer immediately"
  - "Disable it so it won't start at boot"
  - "Mask it so it cannot be started at all"
  - "Confirm `systemctl is-enabled sys-maintenance.timer` reports masked"

hints:
  - "Three steps: stop, disable, mask. `sudo systemctl stop sys-maintenance.timer`, then `disable`, then `mask`."
  - "Mask is stronger than disable — it links the unit to /dev/null, making it impossible to start."
  - "Verify: `systemctl is-enabled sys-maintenance.timer` → 'masked'. Also `systemctl list-timers --all` should not list it."

setup:
  - "mkdir -p /etc/systemd/system"
  - "printf '[Unit]\\\\nDescription=System Maintenance\\\\n\\\\n[Timer]\\\\nOnCalendar=*-*-* 03:33:00\\\\n\\\\n[Install]\\\\nWantedBy=timers.target\\\\n' > /etc/systemd/system/sys-maintenance.timer"
  - "printf '[Unit]\\\\nDescription=Maintenance Script\\\\n\\\\n[Service]\\\\nType=oneshot\\\\nExecStart=/bin/true\\\\n' > /etc/systemd/system/sys-maintenance.service"
  - "systemctl daemon-reload 2>/dev/null || true"
  - "systemctl enable --now sys-maintenance.timer 2>/dev/null || true"

checks:
  - kind: cmd_stdout_eq
    command: "systemctl is-enabled sys-maintenance.timer"
    expect: "masked"
    describe: "the timer must be masked (impossible to start)"

solution:
  - "systemctl stop sys-maintenance.timer"
  - "systemctl disable sys-maintenance.timer"
  - "systemctl mask sys-maintenance.timer"

scoring:
  base: 180
  hint_penalty: 30
  par_seconds: 120
