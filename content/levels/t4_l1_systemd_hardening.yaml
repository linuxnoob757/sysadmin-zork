id: t4_l1_systemd_hardening
tier: 4
order: 1
title: "Who's Knocking"
requires_real_vm: true
prerequisites: [t3_l5_reverse_proxy]

intro: |
  The Ferryman has been testing the fence line. Somewhere under the
  firewall there's a listener that shouldn't be there — a backdoor held
  open on a port nobody filed. Walk the perimeter with `ss -tlnp`, find
  the unexpected listener, record its port in /root/perimeter.txt, then
  shut it down.

victory_text: |
  There it is — a port nobody filed, held open by a backdoor. Written
  down, then killed. Know your own attack surface before someone else
  maps it for you. (+130)

objectives:
  - "List listening TCP ports (ss -tlnp)"
  - "Identify the unexpected listener on port 6667"
  - "Record that port in /root/perimeter.txt"
  - "Kill the backdoor process"

hints:
  - "`sudo ss -tlnp | grep 6667` finds the listener and its PID."
  - "Record: `echo 6667 | sudo tee /root/perimeter.txt`. Kill: `sudo kill <PID>`."
  - "A port with no known service behind it is a backdoor. Don't trust it."

setup:
  - "mkdir -p /root"
  - "python3 -c 'import socket; s=socket.socket(); s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1); s.bind((\"0.0.0.0\",6667)); s.listen(5); import time; time.sleep(99999)' &"
  - "sleep 1"
  - "rm -f /root/perimeter.txt"

checks:
  - kind: file_exists
    path: /root/perimeter.txt
    describe: "the backdoor port must be recorded in /root/perimeter.txt"
  - kind: cmd_fails
    command: "ss -tlnp 2>/dev/null | grep ':6667'"
    describe: "the backdoor listener on port 6667 must be shut down"

solution:
  - "echo 6667 | sudo tee /root/perimeter.txt"
  - "PID=$(ss -tlnp 2>/dev/null | grep ':6667' | grep -oP 'pid=\\K[0-9]+' | head -1); kill $PID 2>/dev/null; true"

scoring:
  base: 130
  hint_penalty: 30
  par_seconds: 150
