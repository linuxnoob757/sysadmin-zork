id: t2_l3_tar_extraction
tier: 2
order: 3
title: "The Locked Gate"
requires_real_vm: true
prerequisites: [t2_l2_vendor_agent]

intro: |
  04:10. `sudo` comes back with: deploy is not in the sudoers file. This
  incident will be reported. And worse — nobody can sudo. The whole gate
  is welded shut by a single fat-fingered line in /etc/sudoers.

  If it has one syntax error, sudo refuses EVERYONE. You don't edit
  sudoers with a normal editor. You use `visudo` — it validates before
  saving. `visudo -c` will tell you which line GREERSON broke.

  Fix the broken line, grant the 'deploy' user sudo access, and prove
  with `visudo -c` that the gate is sound.

victory_text: |
  `/etc/sudoers: parsed OK`. The gate swings clean again. deploy can
  run its blessed commands.

  Start versus enable. visudo versus vi. The one that validates vs the
  one that lets you lock yourself out — choose the validating one every
  time. (+160)

objectives:
  - "Identify the syntax-error line in /etc/sudoers"
  - "Repair the syntax error"
  - "Grant the 'deploy' user sudo access"
  - "Confirm `visudo -c` validates cleanly"

hints:
  - "`sudo visudo -c` names the broken line."
  - "Open with `sudo visudo`. Fix the broken line. Add `deploy ALL=(ALL) ALL`."
  - "`sudo visudo` validates on save. Confirm with `sudo visudo -c` → 'parsed OK'."

setup:
  - "echo 'deploy ALL=(ALL:ALL) NOPASSWD: ALL' >> /etc/sudoers"
  - "echo 'thisisbroken line with bad syntax' >> /etc/sudoers"

checks:
  - kind: cmd_succeeds
    command: "sudo visudo -c"
    describe: "sudoers file must validate with no syntax errors"
  - kind: cmd_stdout_contains
    command: "getent group wheel"
    expect: "deploy"
    describe: "deploy user must have sudo/group access"

solution:
  - "sed -i '/thisisbroken line with bad syntax/d' /etc/sudoers"
  - "sed -i 's/NOPASSWD: ALL/ALL/' /etc/sudoers"
  - "usermod -aG wheel deploy"

scoring:
  base: 160
  hint_penalty: 30
  par_seconds: 180
