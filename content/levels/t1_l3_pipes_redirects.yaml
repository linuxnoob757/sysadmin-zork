id: t1_l3_pipes_redirects
tier: 1
order: 3
title: "Needle in the Haystack"
requires_real_vm: false
prerequisites: [t1_l2_permissions]

intro: |
  03:14 AM. The hour when bad decisions come home to roost.

  The web app is bleeding debug output straight to real customers —
  stack traces, internal file paths, the guts of the machine spilled
  across the screen. Somewhere under /etc/app GREERSON flipped
  DEBUG=on — "just to check something" — and then did what he always
  did: got bored, wandered off, never flipped it back.

  There are hundreds of config files under /etc/app. Exactly one of
  them carries the line DEBUG=on. Find the guilty file. Flip it to
  DEBUG=off, leaving all other files untouched.

victory_text: |
  One line, buried in a haystack of hundreds, dragged into the light.
  DEBUG's off. You didn't read every file. You asked the right question
  and let `grep` do the reading — which is the entire difference between
  an admin and a martyr. (+150)

objectives:
  - "Locate the config file under /etc/app containing 'DEBUG=on'"
  - "Change that single line to DEBUG=off"
  - "Confirm no file under /etc/app still has DEBUG=on"

hints:
  - "You don't search by hand. `grep -rn 'DEBUG=on' /etc/app` finds the file and the line number."
  - "Once you know the file, edit it: `sed -i 's/DEBUG=on/DEBUG=off/' <file>`. Verify with grep again."
  - "Confirm: `grep -r 'DEBUG=on' /etc/app` should return nothing after the fix. Then `check`."

setup:
  - "mkdir -p /etc/app"
  - "for i in $(seq 1 50); do printf 'app.setting=true\\\\napp.debug=false\\\\n' > /etc/app/service-$i.conf; done"
  - "printf 'app.name=vault-service\\\\nDEBUG=on\\\\napp.port=8443\\\\n' > /etc/app/vault-service.conf"

checks:
  - kind: cmd_stdout_contains
    command: "grep -r 'DEBUG=off' /etc/app/vault-service.conf"
    expect: "DEBUG=off"
    describe: "the offending file must be flipped to DEBUG=off"
  - kind: cmd_stdout_eq
    command: "grep -rl 'DEBUG=on' /etc/app 2>/dev/null | wc -l"
    expect: "0"
    describe: "no config file under /etc/app may still contain DEBUG=on"

solution:
  - "sed -i 's/DEBUG=on/DEBUG=off/' /etc/app/vault-service.conf"

scoring:
  base: 150
  hint_penalty: 30
  par_seconds: 120
