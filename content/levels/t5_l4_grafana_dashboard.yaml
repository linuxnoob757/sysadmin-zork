id: t5_l4_grafana_dashboard
tier: 5
order: 4
title: "What He's Running Right Now"
requires_real_vm: true
prerequisites: [t5_l3_node_exporter]

intro: |
  The schedule's dead. But the Ferryman has a LIVE foothold running right
  now — a backdoor process with a socket open to his IP. Find it in the
  process table: an ss ESTAB connection to 198.51.100.66. Trace the PID to
  its binary (probably in /tmp), kill the process, and delete the binary
  so it can't be relaunched.

victory_text: |
  Dead. Process gone, socket closed, binary wiped. You followed a live
  socket back to a PID, a PID back to a file in /tmp, and you ended both
  the process and the thing on disk that could relaunch it. (+200)

objectives:
  - "Find the established connection to the attacker IP (ss -tnp)"
  - "Trace it to its PID and backing binary"
  - "Kill the process and remove the binary from disk"

hints:
  - "`sudo ss -tnp | grep 198.51.100.66` finds the live connection + PID."
  - "Trace: `sudo ls -l /proc/<PID>/exe` shows the binary path."
  - "Kill: `sudo kill -9 <PID>`. Remove: `sudo rm -f <binary>`."

setup:
  - "mkdir -p /tmp/.cache"
  - "nohup bash -c 'exec -a ferryman-listener /bin/bash -c \"while true; do sleep 1; done\"' >/dev/null 2>&1 &"
  - "echo 'placeholder'"

checks:
  - kind: cmd_fails
    command: "ps aux 2>/dev/null | grep '[f]erryman'"
    describe: "the backdoor process must be killed"
  - kind: file_absent
    path: /tmp/.ferryman-bin
    describe: "the backdoor binary must be removed from disk"

solution:
  - "PID=$(ps aux 2>/dev/null | grep '[f]erryman' | awk '{print $2}' | head -1); kill -9 $PID 2>/dev/null; true"
  - "rm -f /tmp/.ferryman-bin"

scoring:
  base: 200
  hint_penalty: 30
  par_seconds: 180
