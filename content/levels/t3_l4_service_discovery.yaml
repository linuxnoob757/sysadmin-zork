id: t3_l4_service_discovery
tier: 3
order: 4
title: "The Rising Tide"
requires_real_vm: true
prerequisites: [t3_l3_ssh_tunnel]

intro: |
  No space left on device. The disk is 100% full — a log that never
  rotated under /var, quietly filling the box for weeks. A full disk
  breaks everything at once, all silently.

  Find the flood source with `df -h` then `du -sh /var/*`. Reclaim
  space by truncating or removing the runaway file. Get the filesystem
  back under control.

victory_text: |
  `df -h` reads like a reprieve — free space where there was none. You
  followed the water uphill with `du`, found the thing flooding the box,
  and pulled the plug. Check the disk FIRST — that's the lesson. (+170)

objectives:
  - "Identify the full filesystem and the directory consuming it"
  - "Reclaim space by clearing the offending file"
  - "Confirm free space is available again"

hints:
  - "Find the full disk: `df -h`. Then follow the water: `du -sh /var/* | sort -h`."
  - "The hog is a stale log file. Truncate it safely: `truncate -s 0 <file>` (or `: > <file>`)."
  - "Verify with `df -h` — free space should be nonzero. Then `check`."

setup:
  - "mkdir -p /var/log/batch"
  - "fallocate -l 500M /var/log/batch/run.log 2>/dev/null || dd if=/dev/zero of=/var/log/batch/run.log bs=1M count=500 2>/dev/null || truncate -s 500M /var/log/batch/run.log"

checks:
  - kind: cmd_succeeds
    command: "test $(df --output=avail -BM / | tail -1 | tr -dc '0-9') -gt 100"
    describe: "root filesystem must have at least 100MB free after cleanup"
  - kind: cmd_stdout_eq
    command: "stat -c %s /var/log/batch/run.log"
    expect: "0"
    describe: "the runaway log must be truncated to zero bytes"

solution:
  - "truncate -s 0 /var/log/batch/run.log"

scoring:
  base: 170
  hint_penalty: 30
  par_seconds: 150
