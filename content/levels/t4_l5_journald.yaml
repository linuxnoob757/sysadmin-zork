id: t4_l5_journald
tier: 4
order: 5
title: "The Front Door"
requires_real_vm: true
prerequisites: [t4_l4_auditd]

intro: |
  The last and most important lock: SSH itself. The logs show thousands of
  failed login attempts — brute force. And root can log in directly, and
  password auth is on. Disable direct root login and password authentication.
  Keys only.

victory_text: |
  sshd -t passes clean, sshd reloaded. The brute-force stops. Root can't
  be reached from outside. Only keys open the door now. (+180)

objectives:
  - "Set PermitRootLogin no in /etc/ssh/sshd_config"
  - "Set PasswordAuthentication no in /etc/ssh/sshd_config"
  - "Validate with sshd -t and restart sshd"

hints:
  - "Edit /etc/ssh/sshd_config with `sudo sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/'`."
  - "And `sudo sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/'`."
  - "Validate: `sudo sshd -t`. Restart: `sudo systemctl restart sshd`. Verify: `sudo sshd -T | grep permitrootlogin` → no."

setup:
  - "sed -i 's/^#*PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config 2>/dev/null || true"
  - "sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config 2>/dev/null || true"

checks:
  - kind: cmd_stdout_contains
    command: "sshd -T 2>/dev/null | grep '^permitrootlogin '"
    expect: "no"
    describe: "PermitRootLogin must be disabled"
  - kind: cmd_stdout_contains
    command: "sshd -T 2>/dev/null | grep '^passwordauthentication '"
    expect: "no"
    describe: "PasswordAuthentication must be disabled"

solution:
  - "sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config"
  - "sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config"
  - "sshd -t"
  - "systemctl restart sshd"

scoring:
  base: 180
  hint_penalty: 30
  par_seconds: 150
