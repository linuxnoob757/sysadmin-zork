[project]
name = "sysadmin-zork"
version = "0.0.1"
description = "A Zork-style text adventure that teaches Linux system administration on a real VM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sysadmin-zork = "engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
