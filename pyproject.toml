[project]
name = "sysadmin-zork"
version = "0.1.0"
description = "A noir-voiced, RHCSA-style Linux training game."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
